<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập</title>
    <link rel="stylesheet" href="register-login/style.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>
<body>
    <div class="container">
        <div class="signup-link">
            <div class="logo">
                <a href="homepage.html">
                    <i class='bx bx-cart'></i>
                    <span class="text">BUY TOGETHER</span>
                </a>
            </div>
            <p class="side-big-heading">Chưa có tài khoản?</p>
            <p class="primary-big-text">Để có thể tham gia giao dịch, vui lòng tạo tài khoản của bạn</p>
            <a href="dangky.html" class="loginbtn">Đăng Ký</a>
        </div>
        <form action="" class="login-form-container">
            <p class="big-heading">Đăng Nhập</p>
            <div class="social-media-platform">
                <a href="#"><i class='bx bx-sm bxl-facebook' ></i></a>
                <a href="#"><i class='bx bx-sm bxl-google' ></i></a>
            </div>
            <div class="login-form-contents">
                <div class="text-fields email">
                    <label for="email"><i class='bx bx-user'></i></label>
                    <input type="email" name="email" id="email" placeholder="Nhập CCCD">
                </div>
                <div class="text-fields password">
                    <label for="password"><i class='bx bx-lock-alt' ></i></label>
                    <input type="password" name="password" id="password" placeholder="Nhập mật khẩu">
                </div>
            </div>
            <input type="submit" value="Đăng Nhập" class="nextPage">
        </form>
</body>
<script src="https://unpkg.com/boxicons@2.1.4/dist/boxicons.js"></script>
</html>
